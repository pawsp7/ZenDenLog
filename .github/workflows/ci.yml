name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:../data/zendenlog.db
      NEXTAUTH_SECRET: ci-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: mkdir -p data
      - run: npm ci
      - run: npm test
      - run: npx prisma db push
      - run: npm run build
